<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Traveler</title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ملف CSS الخاص بنا -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white font-sans pb-20 select-none">

    <!-- قسم 1: الرئيسية (التعدين ) -->
    <section id="home-section" class="page-section active p-4">
        <div class="text-center mt-8 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <h2 class="text-gray-400 text-sm">طاقة الكرونو 💎</h2>
            <h1 class="text-4xl font-bold crystal-text mt-2" id="balance-display">0.000</h1>
            <div class="flex justify-between mt-4 text-xs text-gray-400">
                <span>في الساعة: <span class="text-green-400" id="hourly-rate">0</span></span>
                <span>في الثانية: <span class="text-green-400" id="second-rate">0.00</span></span>
            </div>
        </div>
        <button onclick="manualCollect()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all text-lg">
            ⚡ تجميع يدوي
        </button>
    </section>

    <!-- قسم 2: المتجر (البوابات الزمنية) -->
    <section id="shop-section" class="page-section hidden p-4">
        <h2 class="text-xl font-bold mb-4 border-b border-slate-700 pb-2">البوابات الزمنية ⏳</h2>
        <div class="grid grid-cols-2 gap-4" id="shop-items">
            <!-- سيتم توليد العناصر هنا بواسطة JavaScript -->
        </div>
    </section>

    <!-- قسم 3: المهام (الإعلانات والعروض) -->
    <section id="tasks-section" class="page-section hidden p-4">
        <div class="bg-slate-800 p-4 rounded-xl mb-4 border border-slate-700 flex justify-between items-center">
            <div>
                <h2 class="text-lg font-bold">مهمات الزمن 🚀</h2>
                <p class="text-xs text-gray-400">أكمل المهام لربح طاقة إضافية</p>
            </div>
            <span class="text-2xl">📜</span>
        </div>
        <div class="flex flex-col gap-3" id="tasks-list">
            <!-- سيتم توليد المهام هنا بواسطة JavaScript -->
        </div>
    </section>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700 flex justify-around items-center p-3 text-xs text-gray-400 z-50">
        <div class="nav-item active flex flex-col items-center cursor-pointer" onclick="switchTab('home')">
            <span class="text-2xl mb-1">🏠</span> الرئيسية
        </div>
        <div class="nav-item flex flex-col items-center cursor-pointer" onclick="switchTab('shop')">
            <span class="text-2xl mb-1">🛒</span> المتجر
        </div>
        <div class="nav-item flex flex-col items-center cursor-pointer" onclick="switchTab('tasks')">
            <span class="text-2xl mb-1">🎯</span> المهام
        </div>
    </nav>

    <!-- ملفات JavaScript -->
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
